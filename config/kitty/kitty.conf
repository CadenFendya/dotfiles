# Matches foot/waybar/rofi: black see-through background, white text,
# no borders, GitHub Dark colours (see current-theme.conf)

# ── Font ─────────────────────────────────────────────────────────────
font_family        Iosevka Nerd Font
font_size          11
disable_ligatures  cursor

# ── Window ───────────────────────────────────────────────────────────
background_opacity         0.8
dynamic_background_opacity yes
window_padding_width    6 8
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell       no
remember_window_size    no

# ── Cursor ───────────────────────────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0

# ── Behaviour ────────────────────────────────────────────────────────
scrollback_lines      10000
mouse_hide_wait       3.0
strip_trailing_spaces smart
url_style             straight
update_check_interval 0

# ── Splits (only shown when used) ────────────────────────────────────
enabled_layouts     splits, stack
inactive_text_alpha 0.6
window_border_width 0

# ── Tab bar (hidden until a second tab exists) ───────────────────────
tab_bar_edge          bottom
tab_bar_style         separator
tab_separator         "  "
tab_bar_min_tabs      2
tab_title_template    "{index}:{title}"
active_tab_font_style   bold
inactive_tab_font_style normal

# ── Colours ──────────────────────────────────────────────────────────
# foreground            #ffffff
# background            #000000
# cursor                #ffffff
# cursor_text_color     #000000
# selection_foreground  none
# selection_background  #333333
# url_color             #c4a7e7
# tab_bar_background    #000000
# active_tab_foreground   #ffffff
# active_tab_background   #000000
# inactive_tab_foreground #777777
# inactive_tab_background #000000

# black / bright black
# color0  #000000
# color8  #555555
# red (love)
# color1  #eb6f92
# color9  #eb6f92
# green (pine)
# color2  #31748f
# color10 #31748f
# yellow (gold)
# color3  #f6c177
# color11 #f6c177
# blue (foam)
# color4  #9ccfd8
# color12 #9ccfd8
# magenta (iris)
# color5  #c4a7e7
# color13 #c4a7e7
# cyan (rose)
# color6  #ebbcba
# color14 #ebbcba
# white
# color7  #e0e0e0
# color15 #ffffff

# ── Keys ─────────────────────────────────────────────────────────────
# Splits in the current directory
map ctrl+shift+enter   launch --location=split --cwd=current
map ctrl+shift+minus   launch --location=hsplit --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+z       toggle_layout stack
map ctrl+alt+h         neighboring_window left
map ctrl+alt+j         neighboring_window down
map ctrl+alt+k         neighboring_window up
map ctrl+alt+l         neighboring_window right

# New tab in current directory
map ctrl+shift+t       new_tab_with_cwd

# Opacity on the fly (useful over busy wallpapers)
map ctrl+shift+a>m     set_background_opacity +0.1
map ctrl+shift+a>l     set_background_opacity -0.1
map ctrl+shift+a>d     set_background_opacity default


# BEGIN_KITTY_THEME
# GitHub Dark
include current-theme.conf
# END_KITTY_THEME

# Keep GitHub Dark text colors but use a plain black (untinted) background
background           #000000
cursor_text_color    #000000
tab_bar_background   #000000
