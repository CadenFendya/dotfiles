# Matches waybar/rofi: square, borderless, translucent black, white Iosevka

general {
    hide_cursor = true
    ignore_empty_input = true
}

# same blur as Hyprland's decoration.blur
background {
    monitor =
    path = ~/Pictures/Wallpaper/cornelius-ventures-Ak81Vc-kCf4-unsplash.jpg
    blur_size = 8
    blur_passes = 2
    vibrancy = 1
    brightness = 0.8
}

# panel, like the rofi window
shape {
    monitor =
    size = 500, 260
    color = rgba(0, 0, 0, 0.45)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = <b>$TIME</b>
    font_family = Iosevka Nerd Font
    font_size = 72
    color = rgba(255, 255, 255, 1.0)
    position = 0, 55
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +%m-%d-%Y
    font_family = Iosevka Nerd Font
    font_size = 13
    color = rgba(119, 119, 119, 1.0)
    position = 0, -10
    halign = center
    valign = center
}

# like the rofi input bar
input-field {
    monitor =
    size = 440, 38
    outline_thickness = 0
    rounding = 0
    inner_color = rgba(255, 255, 255, 0.06)
    font_color = rgba(255, 255, 255, 1.0)
    check_color = rgba(255, 255, 255, 0.12)
    fail_color = rgba(255, 123, 114, 0.18)
    font_family = Iosevka Nerd Font
    placeholder_text = <span foreground="##777777">password</span>
    fail_text = <span foreground="##ff7b72">wrong password</span>
    dots_size = 0.2
    dots_spacing = 0.4
    dots_rounding = 0
    fade_on_empty = false
    shadow_passes = 0
    position = 0, -75
    halign = center
    valign = center
}
